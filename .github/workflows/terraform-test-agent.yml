# Runs from the default-branch workflow definition after terraform-ci.
# PR cannot swap this file or the secret path. Model never receives write tokens.
name: terraform-test-agent

on:
  workflow_run:
    workflows: ["terraform-ci"]
    types: [completed]

permissions: {}

jobs:
  agent:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          egress-policy: audit

      - name: Guard fork and empty PR list
        id: guard
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = context.payload.workflow_run;
            const headRepo = run.head_repository && run.head_repository.full_name;
            const baseRepo = context.repo.owner + '/' + context.repo.repo;
            const prs = run.pull_requests || [];
            const ok = headRepo === baseRepo && prs.length > 0;
            core.setOutput('ok', ok ? 'true' : 'false');
            if (!ok) {
              core.info(`skip: headRepo=${headRepo} baseRepo=${baseRepo} prs=${prs.length}`);
              return;
            }
            core.setOutput('pr', String(prs[0].number));
            core.setOutput('sha', run.head_sha);
            core.setOutput('head_branch', run.head_branch);
            core.setOutput('base_sha', prs[0].base.sha);

      - name: Checkout default branch (trusted scripts)
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR head (module tree)
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.guard.outputs.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        if: steps.guard.outputs.ok == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Setup Python
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Collect changed files
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        run: |
          git fetch origin ${{ github.event.repository.default_branch }} --depth=1
          git diff --name-only origin/${{ github.event.repository.default_branch }}...HEAD > /tmp/changed.txt
          git log -1 --pretty=%B > /tmp/commit_msg.txt
          git diff origin/${{ github.event.repository.default_branch }}...HEAD > /tmp/diff.patch || true
          # Replace agent scripts with the trusted default-branch copy
          rm -rf scripts/agent .github/skills .github/agents
          cp -a ../trusted/scripts/agent scripts/agent
          cp -a ../trusted/.github/skills .github/skills
          cp -a ../trusted/.github/agents .github/agents

      - name: Run agent
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          python -m pip install -r scripts/agent/requirements.txt
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Author step may use the key; verification subprocess strips it.
          PYTHONPATH=scripts/agent python scripts/agent/runner.py \
            --repo . \
            --trusted-root . \
            --changed-files /tmp/changed.txt \
            --commit-message "$(cat /tmp/commit_msg.txt)" \
            --diff-file /tmp/diff.patch \
            --run-url "$RUN_URL" \
            --output agent-output/result.json

      - name: Commit tests if any
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          HEAD_BRANCH: ${{ steps.guard.outputs.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          FILES=$(python -c 'import json; print(" ".join(json.load(open("agent-output/result.json")).get("written_files") or []))')
          if [ -z "${FILES}" ]; then
            echo "no files to commit"
            exit 0
          fi
          PYTHONPATH=scripts/agent python scripts/agent/commit_tests.py \
            --repo . \
            --head-branch "$HEAD_BRANCH" \
            --default-branch "$DEFAULT_BRANCH" \
            --files $FILES
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Report to pull request
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${NEW_SHA:-${{ steps.guard.outputs.sha }}}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PYTHONPATH=scripts/agent python scripts/agent/gh_report.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.guard.outputs.pr }}" \
            --sha "$SHA" \
            --result agent-output/result.json \
            --run-url "$RUN_URL"
