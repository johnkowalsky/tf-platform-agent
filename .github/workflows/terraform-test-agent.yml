# Runs from the default-branch workflow definition after terraform-ci.
# PR cannot swap this file or the secret path. Model never receives write tokens.
# Continues when module-tests failed (continue-on-error) as long as static passed
# and the workflow concluded successfully.
name: terraform-test-agent

on:
  workflow_run:
    workflows: ["terraform-ci"]
    types: [completed]

permissions: {}

concurrency:
  group: terraform-test-agent-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  agent:
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Resolve pull request
        id: guard
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const run = context.payload.workflow_run;
            const headRepo = run.head_repository && run.head_repository.full_name;
            const baseRepo = `${context.repo.owner}/${context.repo.repo}`;
            const headSha = run.head_sha;
            core.setOutput('ok', 'false');

            if (headRepo !== baseRepo) {
              core.info(`skip: fork headRepo=${headRepo}`);
              return;
            }

            let prNumber = null;
            let baseSha = null;
            let headBranch = run.head_branch;

            const embedded = run.pull_requests || [];
            const match = embedded.find((pr) => pr.head && pr.head.sha === headSha) || embedded[0];
            if (match) {
              prNumber = match.number;
              baseSha = match.base && match.base.sha;
              if (match.head && match.head.ref) {
                headBranch = match.head.ref;
              }
            }

            if (!prNumber) {
              const pulls = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
              });
              const open = (pulls.data || []).filter(
                (pr) => pr.state === 'open' && pr.head && pr.head.sha === headSha && !pr.head.repo.fork
              );
              if (open.length === 0) {
                core.info(`skip: no open same-repo PR for ${headSha}`);
                return;
              }
              prNumber = open[0].number;
              baseSha = open[0].base.sha;
              headBranch = open[0].head.ref;
            }

            // When CI failed, only continue if the static job passed (module-tests may fail).
            if (run.conclusion === 'failure') {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const staticJob = (jobs.data.jobs || []).find((j) => j.name === 'static');
              if (!staticJob || staticJob.conclusion !== 'success') {
                core.info('skip: static job did not succeed');
                return;
              }
            }

            core.setOutput('ok', 'true');
            core.setOutput('pr', String(prNumber));
            core.setOutput('sha', headSha);
            core.setOutput('head_branch', headBranch);
            core.setOutput('base_sha', baseSha || '');

      - name: Checkout default branch (trusted scripts)
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR head (module tree, no credentials)
        if: steps.guard.outputs.ok == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.guard.outputs.sha }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Terraform
        if: steps.guard.outputs.ok == 'true'
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Setup Python
        if: steps.guard.outputs.ok == 'true'
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Overlay trusted agent and collect diff
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_SHA: ${{ steps.guard.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          if [ -n "${BASE_SHA}" ]; then
            git fetch origin "${BASE_SHA}" --depth=1 || true
            DIFF_BASE="${BASE_SHA}"
          else
            DIFF_BASE="origin/${DEFAULT_BRANCH}"
          fi
          git diff --name-only "${DIFF_BASE}...HEAD" > /tmp/changed.txt
          git log -1 --pretty=%B > /tmp/commit_msg.txt
          git diff "${DIFF_BASE}...HEAD" > /tmp/diff.patch || true
          rm -rf scripts/agent .github/skills .github/agents
          cp -a ../trusted/scripts/agent scripts/agent
          cp -a ../trusted/.github/skills .github/skills
          cp -a ../trusted/.github/agents .github/agents

      - name: Run agent
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r scripts/agent/requirements.txt
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PYTHONPATH=scripts/agent python scripts/agent/runner.py \
            --repo . \
            --trusted-root . \
            --changed-files /tmp/changed.txt \
            --commit-message "$(cat /tmp/commit_msg.txt)" \
            --diff-file /tmp/diff.patch \
            --run-url "$RUN_URL" \
            --output agent-output/result.json

      - name: Commit tests if any
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          HEAD_BRANCH: ${{ steps.guard.outputs.head_branch }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          FILES=$(python -c 'import json; print(" ".join(json.load(open("agent-output/result.json")).get("written_files") or []))')
          if [ -z "${FILES}" ]; then
            echo "no files to commit"
            exit 0
          fi
          # Apply credentials only for this push; Terraform never saw them.
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          PYTHONPATH=scripts/agent python scripts/agent/commit_tests.py \
            --repo . \
            --head-branch "$HEAD_BRANCH" \
            --default-branch "$DEFAULT_BRANCH" \
            --files $FILES
          git remote set-url origin "https://github.com/${{ github.repository }}.git"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Upload agent JUnit
        if: always() && steps.guard.outputs.ok == 'true'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: agent-terraform-junit
          path: work/agent-output/junit-*.xml
          if-no-files-found: ignore

      - name: Report to pull request
        if: steps.guard.outputs.ok == 'true'
        working-directory: work
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${NEW_SHA:-${{ steps.guard.outputs.sha }}}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          PYTHONPATH=scripts/agent python scripts/agent/gh_report.py \
            --repo "${{ github.repository }}" \
            --pr "${{ steps.guard.outputs.pr }}" \
            --sha "$SHA" \
            --result agent-output/result.json \
            --run-url "$RUN_URL"
