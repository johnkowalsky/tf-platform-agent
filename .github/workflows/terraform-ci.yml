# Secret-free PR checks. No LLM key. No Azure credentials.
# Static jobs are the hard gate. Module tests use continue-on-error so a
# stale tftest still completes the workflow and can wake terraform-test-agent.
name: terraform-ci

on:
  pull_request:
    paths:
      - "modules/**"
      - "stacks/data-platform/**"
      - "scripts/agent/**"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
      - ".checkov.yaml"
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "stacks/data-platform/**"
      - "scripts/agent/**"

permissions: {}

concurrency:
  group: terraform-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ARM_CLIENT_ID: ""
      ARM_CLIENT_SECRET: ""
      ARM_SUBSCRIPTION_ID: ""
      ARM_TENANT_ID: ""
      ARM_ACCESS_KEY: ""
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Fmt
        run: terraform fmt -check -recursive

      - name: Install TFLint
        env:
          TFLINT_VERSION: v0.55.1
          # sha256 of tflint_linux_amd64.zip from the same GitHub release checksums.txt
          TFLINT_SHA256: 53379f38bc1e86c18885bfc85dc5fe2cd1f59729ae9a2afa16905189c1d67aa9
        run: |
          set -euo pipefail
          base="https://github.com/terraform-linters/tflint/releases/download/${TFLINT_VERSION}"
          curl -sSfL -o /tmp/tflint.zip "${base}/tflint_linux_amd64.zip"
          curl -sSfL -o /tmp/tflint_checksums.txt "${base}/checksums.txt"
          echo "${TFLINT_SHA256}  /tmp/tflint.zip" | sha256sum -c -
          grep 'tflint_linux_amd64.zip$' /tmp/tflint_checksums.txt | (cd /tmp && sha256sum -c -)
          unzip -o /tmp/tflint.zip -d /tmp
          sudo install -m 0755 /tmp/tflint /usr/local/bin/tflint
          tflint --version

      - name: TFLint modules
        run: |
          set -euo pipefail
          for dir in modules/*; do
            (cd "$dir" && tflint --init && tflint -f compact)
          done

      - name: Validate stack
        working-directory: stacks/data-platform
        run: |
          terraform init -backend=false
          terraform validate

      - name: Agent unit tests
        working-directory: scripts/agent
        run: |
          python -m pip install --require-hashes -r requirements.txt
          PYTHONPATH=. python -m pytest -q tests/

      - name: Checkov
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: modules
          framework: terraform
          config_file: .checkov.yaml
          baseline: .checkov.baseline
          soft_fail: false

      - name: Checkov stacks
        uses: bridgecrewio/checkov-action@99bb2caf247dfd9f03cf984373bc6043d4e32ebf # v12.1347.0
        with:
          directory: stacks
          framework: terraform
          config_file: .checkov.yaml
          baseline: .checkov.baseline
          soft_fail: false

  module-tests:
    needs: static
    runs-on: ubuntu-latest
    # Stale module tests must not block workflow_run from starting the agent.
    continue-on-error: true
    permissions:
      contents: read
    env:
      ARM_CLIENT_ID: ""
      ARM_CLIENT_SECRET: ""
      ARM_SUBSCRIPTION_ID: ""
      ARM_TENANT_ID: ""
      ARM_ACCESS_KEY: ""
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.11.4
          terraform_wrapper: false

      - name: Test modules
        id: tests
        run: |
          set -euo pipefail
          mkdir -p agent-output
          failed=0
          for dir in modules/*; do
            name=$(basename "$dir")
            echo "==> $name"
            if ! (cd "$dir" && terraform init -backend=false && terraform test -junit-xml="../../agent-output/junit-${name}.xml"); then
              failed=1
            fi
          done
          echo "failed=${failed}" >> "$GITHUB_OUTPUT"
          exit "${failed}"

      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: terraform-junit
          path: agent-output/
